services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: digital_banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: ${DB_PASSWORD:-banking_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d digital_banking"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

spring:
  application:
    name: digital-banking-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digital_banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
